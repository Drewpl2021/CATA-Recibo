# ─────────────────────────────────────────────────────────────
#  CATA-Recibo — todo el sistema, en una sola orden
# ─────────────────────────────────────────────────────────────
#      docker compose up -d --build
#
#  Cinco piezas:
#    base      MySQL, con su volumen para que los datos vivan
#    app       Laravel (php-fpm) — el API
#    web       nginx — reparte: Angular por "/" y el API por "/api"
#    cola      manda los correos de aviso de boleta
#    reloj     las tareas diarias (purgar tokens vencidos)
#
#  Las tres de PHP salen de la MISMA imagen, así que no pueden
#  quedar desincronizadas entre ellas.
# ─────────────────────────────────────────────────────────────
name: cata-recibo

services:

  base:
    image: mysql:8.4
    restart: unless-stopped
    # MySQL 8 trae el binary log activado de fábrica, y con eso encendido
    # exige el privilegio SUPER para crear triggers y procedimientos — algo
    # que el usuario de la aplicación no tiene ni debe tener. Sin esta
    # bandera, la migración que deja trg_planilla_historial y
    # sp_resumen_planilla se cae con el error 1419 apenas la base arranca
    # de cero. Es la salida que la propia MySQL sugiere en ese mensaje;
    # aquí es segura porque la base no replica hacia otro servidor.
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      # La hora del colegio también acá: si MySQL y Laravel van en
      # husos distintos, las firmas de las boletas no coinciden
      # con el reloj de pared.
      TZ: America/Lima
    volumes:
      - datos-mysql:/var/lib/mysql
    healthcheck:
      # Los demás servicios esperan a que esto pase: sin ello,
      # Laravel arranca antes que la base y se cae en el primer
      # `migrate`.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Sin puertos publicados a propósito: la base solo se ve desde
    # dentro de la red de Docker. Para entrar desde fuera, un túnel
    # SSH — no un puerto abierto a internet.

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      base:
        condition: service_healthy
    # "localhost" aquí adentro es el propio contenedor, no el VPS que lo
    # aloja. Si la base del padrón (RENSUN) vive en ese mismo servidor pero
    # fuera de Docker, hay que llamarla por este nombre — no por localhost
    # ni 127.0.0.1 — o la conexión nunca sale del contenedor. Ver
    # RENSUN_DB_HOST en .env.example.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: &entorno-php
      APP_NAME: ${APP_NAME:-CATA-Recibo}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      APP_TIMEZONE: America/Lima
      # El idioma, igual que la hora. El .env de la máquina no entra a la
      # imagen (.dockerignore), y sin estas líneas Laravel arrancaba en
      # inglés: la boleta firmaba "28 de September de 2026" y los mensajes
      # de validación salían en inglés, aunque en local todo se viera en
      # castellano.
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      APP_FAKER_LOCALE: es_PE
      FRONTEND_URL: ${APP_URL}

      DB_CONNECTION: mysql
      DB_HOST: base
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # Los correos de aviso salen por la cola para que la pantalla
      # no se quede esperando al servidor de correo.
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database

      # A la salida estándar: se leen con `docker compose logs`.
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}

      # Obligatorio. Con "log" —el valor por defecto de antes— los correos se
      # escribían en un archivo: nadie recibía el aviso de su boleta y el
      # enlace de "olvidé mi contraseña" no llegaba nunca. Si falta, el
      # contenedor no arranca y lo dice. Ver .env.example.
      MAIL_MAILER: ${MAIL_MAILER:?Falta MAIL_MAILER en el .env - sin correo nadie recibe avisos ni puede recuperar su clave (ver .env.example)}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # "smtp" para el puerto 587 (cifra con STARTTLS) o "smtps" para el 465.
      # "tls" NO es un esquema válido para el mailer de Laravel: con él, el
      # día que se configurara el correo habría fallado igual.
      MAIL_SCHEME: ${MAIL_SCHEME:-smtp}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@ejemplo.com}
      MAIL_FROM_NAME: ${APP_NAME:-CATA-Recibo}

      SESION_INACTIVIDAD_MINUTOS: ${SESION_INACTIVIDAD_MINUTOS:-120}

      # Las dos cuentas con las que se entra a un sistema recién sembrado.
      # Si las contraseñas van vacías, `db:seed` inventa una larga, la enseña
      # una vez y obliga a cambiarla al entrar.
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador del sistema}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@colegio.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RRHH_NOMBRE: ${RRHH_NOMBRE:-Recursos Humanos}
      RRHH_EMAIL: ${RRHH_EMAIL:-rrhh@colegio.com}
      RRHH_PASSWORD: ${RRHH_PASSWORD:-}

      # Dominio de correo de la institución. Vacío por defecto a propósito:
      # el código no lo lleva escrito dentro, lo pone cada despliegue.
      INSTITUCION_DOMINIO_CORREO: ${INSTITUCION_DOMINIO_CORREO:-}

      # Búsqueda de personas por DNI al dar de alta a un trabajador. Es
      # opcional: sin RENSUN_DB_HOST y sin DECOLECTA_TOKEN, los datos se
      # escriben a mano y el sistema funciona igual.
      CONSULTA_DNI_CACHE_DIAS: ${CONSULTA_DNI_CACHE_DIAS:-30}
      DECOLECTA_BASE_URL: ${DECOLECTA_BASE_URL:-https://api.decolecta.com}
      DECOLECTA_TOKEN: ${DECOLECTA_TOKEN:-}
      DECOLECTA_RUTA_DNI: ${DECOLECTA_RUTA_DNI:-/v1/reniec/dni}
      DECOLECTA_TIMEOUT: ${DECOLECTA_TIMEOUT:-8}

      # Base de datos local del padrón. Si no se rellena, el sistema va
      # directo al proveedor externo.
      RENSUN_DB_HOST: ${RENSUN_DB_HOST:-}
      RENSUN_DB_PORT: ${RENSUN_DB_PORT:-3306}
      RENSUN_DB_DATABASE: ${RENSUN_DB_DATABASE:-}
      RENSUN_DB_USERNAME: ${RENSUN_DB_USERNAME:-}
      RENSUN_DB_PASSWORD: ${RENSUN_DB_PASSWORD:-}
      RENSUN_TABLA: ${RENSUN_TABLA:-padron}
      RENSUN_COL_DNI: ${RENSUN_COL_DNI:-dni}
      RENSUN_COL_NOMBRES: ${RENSUN_COL_NOMBRES:-nombres}
      RENSUN_COL_APE_PATERNO: ${RENSUN_COL_APE_PATERNO:-apellido_paterno}
      RENSUN_COL_APE_MATERNO: ${RENSUN_COL_APE_MATERNO:-apellido_materno}
      RENSUN_COL_NACIMIENTO: ${RENSUN_COL_NACIMIENTO:-fecha_nacimiento}
      RENSUN_COL_DIRECCION: ${RENSUN_COL_DIRECCION:-direccion}

      # Este es el que hace las migraciones y cachea la config.
      ROL: api
    volumes:
      # Las boletas y documentos generados. Es lo ÚNICO que hay que
      # respaldar además de la base: si se pierde, los PDF firmados
      # se van con él.
      - archivos:/var/www/html/storage/app

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    ports:
      # Solo esta pieza asoma a internet.
      - "${PUERTO_HTTP:-80}:80"

  cola:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      base:
        condition: service_healthy
      app:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *entorno-php
      # No migra ni cachea: de eso se encarga "app".
      ROL: trabajador
    volumes:
      - archivos:/var/www/html/storage/app
    # --tries=3: un correo que falla se reintenta tres veces antes
    # de darse por perdido. --max-time: el proceso se renueva cada
    # hora, para que una fuga de memoria no crezca sin fin.
    command: php artisan queue:work --tries=3 --sleep=3 --max-time=3600

  reloj:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    depends_on:
      base:
        condition: service_healthy
      app:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *entorno-php
      ROL: reloj
    volumes:
      - archivos:/var/www/html/storage/app
    # schedule:work se queda corriendo y dispara solo las tareas de
    # routes/console.php. Reemplaza al cron del servidor.
    command: php artisan schedule:work

  # ── Respaldo diario ──────────────────────────────────────────────
  # La base y los archivos (PDF de boletas, firmas) cada noche a las
  # 02:00, guardando los últimos 30 días. Usa la misma imagen que la base
  # para que mysqldump sea de la misma versión que el servidor.
  #
  # Restaurar: ver docker/respaldo/restaurar.sh.
  respaldo:
    image: mysql:8.4
    restart: unless-stopped
    depends_on:
      base:
        condition: service_healthy
    environment:
      DB_HOST: base
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      RESPALDO_HORA: ${RESPALDO_HORA:-02:00}
      RESPALDO_DIAS: ${RESPALDO_DIAS:-30}
      TZ: America/Lima
    volumes:
      - ./docker/respaldo:/respaldo:ro
      - respaldos:/respaldos
      # Lectura y escritura: el respaldo solo lee, pero restaurar escribe.
      - archivos:/archivos
    # No arranca MySQL: la imagen se usa solo por sus herramientas.
    entrypoint: ["bash", "/respaldo/cada-noche.sh"]

volumes:
  datos-mysql:
  archivos:
  # Los respaldos diarios. En el mismo disco: cópialos fuera de vez en cuando.
  respaldos:

# Entrega continua: al etiquetar una versión (v1.0.0, v1.1.0…) construye las
# imágenes del sistema y las publica en el registro de GitHub (GHCR), listas
# para que el servidor del colegio las descargue.
name: Entrega de imágenes

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: Publicar imagen ${{ matrix.imagen.nombre }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        imagen:
          - { nombre: app, dockerfile: docker/php/Dockerfile }
          - { nombre: web, dockerfile: docker/web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cata-recibo-${{ matrix.imagen.nombre }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.imagen.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

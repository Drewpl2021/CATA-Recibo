<div class="boletas-container">
  <div class="page-title">
    <h2>MIS DOCUMENTOS</h2>
  </div>

  <div class="toolbar">
    <div class="filter-group">
      <input type="text" class="form-control" placeholder="Buscar por periodo o fecha..." [(ngModel)]="searchTerm" style="min-width: 300px;">
    </div>
  </div>

  <div class="section-panel">
    <div class="panel-header-small">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      <span>Lista de Documentos</span>
    </div>

    <div class="table-responsive">
      <table class="data-table">
        <thead>
          <tr>
            <th class="col-id">#</th>
            <th>Periodo</th>
            <th>Fecha de Emisión</th>
            <th class="text-center">Estado de Firma</th>
            <th class="text-center">Estado de Revisado</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <!-- Sin resultados -->
          <tr *ngIf="filteredDocumentos.length === 0">
            <td colspan="6" class="empty-state">
              No se encontraron documentos.
            </td>
          </tr>

          <tr *ngFor="let doc of filteredDocumentos; let i = index">
            <td class="col-id">{{ i + 1 }}</td>
            <td style="font-weight: 500;">{{ doc.periodo }}</td>
            <td>{{ doc.fechaEmision }}</td>
            
            <td class="text-center">
              <span class="badge" [ngClass]="doc.estadoFirma === 'Firmado' ? 'badge-active' : 'badge-pendiente'">
                {{ doc.estadoFirma }}
              </span>
            </td>

            <td class="text-center">
              <span class="badge" [ngClass]="doc.estadoRevisado === 'Revisado' ? 'badge-active' : 'badge-pendiente'">
                {{ doc.estadoRevisado }}
              </span>
            </td>

            <td class="text-center">
              <button class="btn-icon-blue" (click)="verAccion(doc)" title="Ver Documento">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

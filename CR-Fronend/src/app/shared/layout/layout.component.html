<div class="app-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8"/>
          <path d="M17 8h4"/><path d="M17 12h4"/><path d="M17 16h4"/>
        </svg>
        Colegio <span>Túpac Amaru</span>
      </div>
    </div>

    <nav class="nav-menu">
      <!-- Boletas de Pago (Collapsible) -->
      <a class="nav-item" (click)="toggleBoletas()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Boletas de Pago
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" style="margin-left: auto; transition: transform 0.2s;"
          [style.transform]="isBoletasOpen ? 'rotate(180deg)' : 'rotate(0)'">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </a>

      <!-- Submenu for Boletas de Pago -->
      <div *ngIf="isBoletasOpen" style="padding-left: 20px; display: flex; flex-direction: column; margin-bottom: 4px;">
        <a class="nav-item" [class.active]="activeMenu === 'mis-boletas'" (click)="setActive('mis-boletas')" routerLink="/inicio/mis-boletas">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2"><path d="M15 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8"/>
            <path d="M17 8h4"/><path d="M17 12h4"/><path d="M17 16h4"/>
            <path d="M12 8H8"/><path d="M12 12H8"/><path d="M12 16H8"/></svg>
          Mis Boletas
        </a>
      </div>

      <!-- Documentos -->
      <a class="nav-item" [class.active]="activeMenu === 'documentos'" (click)="setActive('documentos')" routerLink="/inicio/documentos">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Documentos
      </a>

      <!-- Empleados (Admin/RRHH only) -->
      <a *ngIf="isAdmin" class="nav-item" [class.active]="activeMenu === 'empleados'" (click)="setActive('empleados')" routerLink="/inicio/empleados">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        Empleados
      </a>

      <!-- Emisión de Boleta (Admin/RRHH only) -->
      <a *ngIf="isAdmin" class="nav-item" [class.active]="activeMenu === 'emision-boleta'" (click)="setActive('emision-boleta')" routerLink="/inicio/emision-boleta">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/><line x1="16" x2="13" y1="13" y2="13"/><line x1="16" x2="13" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/>
        </svg>
        Emisión de Boleta
      </a>

      <!-- Menús adicionales restaurados para Admin (ELIMINADOS DE NUEVO) -->

      <div style="margin-top: auto; padding-top: 20px;">
        <a class="nav-item" [class.active]="activeMenu === 'settings'" (click)="setActive('settings')">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/></svg>
          Configuración
        </a>
        <a class="nav-item" (click)="logout()">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          Cerrar Sesión
        </a>
      </div>
    </nav>
  </aside>

  <!-- Main Area -->
  <div class="main-wrapper">
    <header class="top-header">
      <div class="header-search">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/></svg>
        <input type="text" placeholder="Buscar documentos, recibos..." />
      </div>

      <div class="header-actions">
        <button class="icon-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="badge">2</span>
        </button>

        <div class="user-profile">
          <div class="avatar">CM</div>
          <div class="user-info">
            <span class="user-name">Carlos Mamani</span>
            <span class="user-role">Docente de Matemáticas</span>
          </div>
        </div>
      </div>
    </header>

    <main class="content-area">
      <router-outlet />
    </main>
  </div>
</div>

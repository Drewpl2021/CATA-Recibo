<div class="form-group">
  <label>¿A quiénes?</label>

  <!-- Todo el personal, o solo algunos -->
  <div class="opciones-alcance" *ngIf="permiteTodos">
    <label class="check-item" [class.is-activo]="esTodos">
      <input type="radio" name="alcance" [checked]="esTodos" (change)="cambiarAlcance('todos')" />
      <span>Todo el personal activo ({{ empleados.length }})</span>
    </label>

    <label class="check-item" [class.is-activo]="!esTodos">
      <input type="radio" name="alcance" [checked]="!esTodos" (change)="cambiarAlcance('elegidos')" />
      <span>Solo a quienes yo elija</span>
    </label>
  </div>
</div>

<ng-container *ngIf="!esTodos || !permiteTodos">
  <!-- Buscador y filtros. Acotan la lista de verdad: lo que se ve es lo que hay. -->
  <div class="buscador-personas">
    <div class="buscador-personas__campo">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
      </svg>
      <input type="text" class="form-control" [(ngModel)]="busqueda"
        placeholder="Busca por nombre, apellido o DNI..." aria-label="Buscar trabajador" />
    </div>

    <div class="buscador-personas__filtros">
      <select class="form-control" [(ngModel)]="filtroArea" *ngIf="areas.length" aria-label="Área">
        <option value="">Todas las áreas</option>
        <option *ngFor="let a of areas" [value]="a.id">{{ a.nombre }}</option>
      </select>

      <select class="form-control" [(ngModel)]="filtroCargo" *ngIf="cargos.length" aria-label="Cargo">
        <option value="">Todos los cargos</option>
        <option *ngFor="let c of cargos" [value]="c.id">{{ c.nombre }}</option>
      </select>

      <select class="form-control" [(ngModel)]="filtroSede" *ngIf="sedes.length" aria-label="Sede">
        <option value="">Todas las sedes</option>
        <option *ngFor="let s of sedes" [value]="s.id">{{ s.nombre }}</option>
      </select>

      <button type="button" class="btn-limpiar" [disabled]="!hayFiltros" (click)="limpiarFiltros()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
        Limpiar
      </button>
    </div>
  </div>

  <!-- Cuántos se ven, cuántos van marcados, y marcar los de la vista de un golpe -->
  <div class="buscador-personas__barra">
    <span class="buscador-personas__cuenta">
      <strong>{{ visibles.length }}</strong> de {{ empleados.length }} en la lista
      <ng-container *ngIf="cuantosMarcados">
        · <strong>{{ cuantosMarcados }}</strong> marcado(s)
      </ng-container>
    </span>

    <span class="buscador-personas__acciones">
      <button type="button" class="enlace-sutil" [disabled]="!visibles.length"
        (click)="alternarVisibles()">
        {{ todosVisiblesMarcados ? 'Desmarcar los de la lista' : 'Marcar los ' + visibles.length + ' de la lista' }}
      </button>
      <button type="button" class="enlace-sutil" *ngIf="cuantosMarcados" (click)="limpiarSeleccion()">
        Limpiar selección
      </button>
    </span>
  </div>

  <!-- Los marcados que el filtro dejó fuera de vista: siguen contando -->
  <p class="form-ayuda" *ngIf="marcadosOcultos">
    Hay <strong>{{ marcadosOcultos }}</strong> marcado(s) que este filtro no deja ver.
    Siguen contando: la operación también les va a caer.
  </p>

  <div class="lista-personas">
    <label class="persona" *ngFor="let e of visibles; trackBy: porId"
      [class.persona--marcada]="estaMarcado(e.id)">
      <input type="checkbox" [checked]="estaMarcado(e.id)" (change)="alternar(e.id)" />
      <span class="persona__datos">
        <strong>{{ e.apellido }}, {{ e.nombre }}</strong>
        <small>DNI {{ e.dni }}</small>
      </span>
    </label>

    <p class="lista-personas__vacio" *ngIf="!visibles.length && empleados.length">
      Ningún trabajador coincide con lo que buscaste.
    </p>
    <p class="lista-personas__vacio" *ngIf="!empleados.length">
      No hay trabajadores activos.
    </p>
  </div>
</ng-container>

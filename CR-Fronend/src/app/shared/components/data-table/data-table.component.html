<div class="section-panel">
  <!-- La barra de arriba solo existe si tiene algo dentro: sin buscador y
       sin botones propios dejaba una franja blanca vacía sobre la tabla. -->
  <div class="panel-header data-table-toolbar" *ngIf="hayBarraSuperior">
    <div class="data-table-search" *ngIf="mostrarBuscador && camposBusqueda.length">
      <svg class="data-table-search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" class="form-control" [(ngModel)]="busqueda" (ngModelChange)="onBuscar()" placeholder="Buscar..." />
    </div>
    <div class="data-table-toolbar-actions">
      <ng-content select="[tableActions]"></ng-content>
    </div>
  </div>

  <div class="table-responsive">
    <table class="data-table">
      <thead>
        <tr>
          <th *ngFor="let col of columnas" [style.width]="col.ancho">{{ col.header }}</th>
          <th *ngIf="acciones.length || accionesPersonalizadas.length" class="celda-acciones"
            style="width: 1%; white-space: nowrap;">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- Mientras llegan las filas se pinta la silueta de la tabla: tantas
             como vayan a caber, con una celda por columna. La tabla no
             cambia de alto cuando llegan los datos. -->
        <tr *ngFor="let f of filasEsqueleto" class="fila-esqueleto">
          <td *ngFor="let col of columnas">
            <span class="esqueleto esqueleto--linea" [style.width]="anchoEsqueleto(col)"></span>
          </td>
          <td *ngIf="acciones.length || accionesPersonalizadas.length" class="celda-acciones">
            <span class="esqueleto esqueleto--linea" style="width: 60px;"></span>
          </td>
        </tr>
        <tr *ngIf="!cargando && filaPagina.length === 0">
          <td [attr.colspan]="columnas.length + (acciones.length || accionesPersonalizadas.length ? 1 : 0)" class="data-table-empty">
            {{ mensajeVacio }}
          </td>
        </tr>
        <tr *ngFor="let fila of filaPagina">
          <td *ngFor="let col of columnas" [class.celda-rompe]="col.romperTexto">
            <ng-container [ngSwitch]="col.tipo">
              <span *ngSwitchCase="'badge'" [ngClass]="claseBadge(fila, col)">
                {{ valorCelda(fila, col) }}
              </span>
              <span *ngSwitchCase="'icono'" class="celda-icono">
                <app-icon [icono]="valorCelda(fila, col)" [tamano]="20"></app-icon>
                <code>{{ valorCelda(fila, col) ?? '—' }}</code>
              </span>
              <ng-container *ngSwitchDefault>{{ valorCelda(fila, col) ?? '—' }}</ng-container>
            </ng-container>
          </td>
          <td *ngIf="acciones.length || accionesPersonalizadas.length" class="celda-acciones">
            <div class="action-btns">
              <button *ngFor="let extra of accionesVisibles(fila)"
                class="btn-icon-accion" [ngClass]="'btn-icon-' + (extra.severidad || 'brand')"
                [class.btn-icon-accion--con-texto]="!!extra.etiqueta"
                [appPista]="extra.titulo" [attr.aria-label]="extra.titulo"
                (click)="accionPersonalizada.emit({ accion: extra.id, fila })">
                <app-icon [icono]="extra.icono" [tamano]="19"></app-icon>
                <span *ngIf="extra.etiqueta">{{ extra.etiqueta }}</span>
              </button>
              <button *ngIf="acciones.includes('ver')" class="btn-icon-blue"
                [appPista]="pistaVer" [attr.aria-label]="pistaVer" (click)="verFila.emit(fila)">
                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
              <button *ngIf="acciones.includes('editar')" class="btn-icon-blue"
                [appPista]="pistaEditar" [attr.aria-label]="pistaEditar" (click)="editarFila.emit(fila)">
                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
              </button>
              <button *ngIf="acciones.includes('eliminar')" class="btn-icon-red"
                [appPista]="pistaEliminar" [attr.aria-label]="pistaEliminar" (click)="eliminarFila.emit(fila)">
                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
                </svg>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="data-table-pagination" *ngIf="totalPaginas > 1">
    <span class="data-table-pagination-info">{{ mostrandoDesde }}–{{ mostrandoHasta }} de {{ totalRegistros }}</span>
    <div class="data-table-pagination-btns">
      <button class="btn-secondary" [disabled]="paginaActual === 1" (click)="irAPagina(paginaActual - 1)">Anterior</button>
      <span class="data-table-pagination-current">
        Página
        <input
          type="number"
          class="form-control data-table-pagination-input"
          [ngModel]="paginaEscrita"
          (ngModelChange)="paginaEscrita = $event"
          (keydown.enter)="irAPaginaEscrita(paginaEscrita)"
          (blur)="irAPaginaEscrita(paginaEscrita)"
          min="1"
          [max]="totalPaginas"
          [attr.aria-label]="'Ir a la página, de ' + totalPaginas + ' en total'"
        />
        de {{ totalPaginas }}
      </span>
      <button class="btn-secondary" [disabled]="paginaActual === totalPaginas" (click)="irAPagina(paginaActual + 1)">Siguiente</button>
    </div>
  </div>
</div>

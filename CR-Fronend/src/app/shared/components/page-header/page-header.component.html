<header class="page-header">
  <div class="page-header__title">
    <span class="page-header__icon">
      <app-icon [nombreModulo]="titulo" [icono]="icono" [tamano]="28"></app-icon>
    </span>
    <div>
      <h1>{{ titulo }}</h1>
      @if (subtitulo) {
        <p>{{ subtitulo }}</p>
      }
    </div>
  </div>

  @if (cifras.length) {
    <div class="cifras-cabecera" [class.cifras-cabecera--refrescando]="cargandoCifras && !mostrarGuion">
      @for (c of cifras; track porEtiqueta($index, c)) {
        <div class="cifras-cabecera__dato"
          [ngClass]="'cifras-cabecera__dato--' + (c.tono || 'brand')">
          <app-icon [icono]="c.icono" [tamano]="17"></app-icon>
          <strong>{{ mostrarGuion ? '—' : (c.valor | number) }}</strong>
          <span>{{ c.etiqueta }}</span>
        </div>
      }
    </div>
  }

  <div class="page-header__actions">
    <ng-content select="[headerActions]"></ng-content>
  </div>
</header>

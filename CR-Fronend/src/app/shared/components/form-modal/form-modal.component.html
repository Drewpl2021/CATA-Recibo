<div class="modal-overlay" *ngIf="visible"
  (mousedown)="alPresionarEnElFondo($event)" (click)="alSoltarEnElFondo($event)">
  <div class="modal-container" [style.max-width]="ancho" (click)="$event.stopPropagation()">
    <div class="modal-header" [class.modal-header--marca]="cabeceraMarca">
      <h2>{{ titulo }}</h2>
      <button class="btn-close" (click)="cerrar()" [disabled]="guardando">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <ng-content></ng-content>
    </div>

    <div class="modal-footer">
      <ng-content select="[modalFooter]"></ng-content>
      <ng-container *ngIf="!ocultarBotonesPorDefecto">
        <button class="btn-secondary" [disabled]="guardando" (click)="cerrar()">Cancelar</button>
        <button class="btn-primary" [disabled]="guardando" (click)="guardar.emit()">
          <span *ngIf="guardando" class="spinner-small"></span>
          {{ guardando ? 'Guardando...' : textoGuardar }}
        </button>
      </ng-container>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="visible" (click)="cerrar()">
  <div class="modal-container" [style.max-width]="ancho" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ titulo }}</h2>
      <button class="btn-close" (click)="cerrar()" [disabled]="guardando">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <ng-content></ng-content>
    </div>

    <div class="modal-footer">
      <ng-content select="[modalFooter]"></ng-content>
      <ng-container *ngIf="!ocultarBotonesPorDefecto">
        <button class="btn-secondary" [disabled]="guardando" (click)="cerrar()">Cancelar</button>
        <button class="btn-primary" [disabled]="guardando" (click)="guardar.emit()">
          <span *ngIf="guardando" class="spinner-small"></span>
          {{ guardando ? 'Guardando...' : textoGuardar }}
        </button>
      </ng-container>
    </div>
  </div>
</div>

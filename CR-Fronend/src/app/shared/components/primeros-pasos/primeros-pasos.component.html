<section class="section-panel pasos" *ngIf="visible" aria-label="Primeros pasos">
  <header class="pasos__cabecera">
    <span class="pasos__icono" aria-hidden="true">
      <app-icon icono="clipboard_check" [tamano]="20"></app-icon>
    </span>

    <div class="pasos__titulos">
      <h2 class="pasos__titulo">Primeros pasos</h2>
      <p class="pasos__intro">{{ intro }}</p>
    </div>

    <div class="pasos__avance">
      <span class="pasos__cifra">{{ guia?.hechos }} de {{ guia?.total }} listos</span>
      <div class="pasos__barra" role="progressbar" [attr.aria-valuenow]="guia?.hechos"
        aria-valuemin="0" [attr.aria-valuemax]="guia?.total">
        <span [style.width.%]="avance"></span>
      </div>
    </div>

    <div class="pasos__acciones">
      <!-- Plegar deja el avance a la vista sin la lista; ocultar lo quita
           para siempre. Son cosas distintas y por eso son dos botones. -->
      <button type="button" class="btn-secondary pasos__plegar" (click)="plegado = !plegado"
        [attr.aria-expanded]="!plegado" [attr.aria-label]="plegado ? 'Ver los pasos' : 'Plegar los pasos'">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          [class.pasos__flecha--plegada]="plegado" class="pasos__flecha">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </button>

      <button type="button" class="btn-secondary" (click)="ocultar()">Ya lo tengo</button>
    </div>
  </header>

  <ol class="pasos__lista" *ngIf="!plegado">
    <li class="pasos__paso" *ngFor="let paso of pendientes">
      <span class="pasos__numero" aria-hidden="true">{{ paso.numero }}</span>

      <div class="pasos__texto">
        <strong>{{ paso.titulo }}</strong>
        <span>{{ paso.detalle }}</span>
      </div>

      <button type="button" class="btn-secondary pasos__ir" (click)="irAlPaso(paso)">
        Ir ahora
      </button>
    </li>
  </ol>
</section>

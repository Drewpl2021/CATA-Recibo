<div class="modal-overlay" *ngIf="request as r" (click)="cancelar()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <!-- El tacho solo cuando de verdad se va a borrar algo. Para confirmar
         una acción normal (aprobar unas vacaciones, por ejemplo) va un visto
         azul: el rojo del tacho hacía que aprobar pareciera destruir. -->
    <div class="modal-icon-danger" *ngIf="r.options.variante !== 'default'">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
        <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
      </svg>
    </div>

    <div class="modal-icon-brand" *ngIf="r.options.variante === 'default'">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><polyline points="8.5 12.5 11 15 15.5 9.5"/>
      </svg>
    </div>
    <h3>{{ r.options.titulo }}</h3>
    <p>{{ r.options.mensaje }}</p>
    <div class="modal-actions">
      <button class="btn-secondary-modal" (click)="cancelar()">{{ r.options.cancelarTexto ?? 'Cancelar' }}</button>
      <button [class]="r.options.variante === 'default' ? 'btn-primary' : 'btn-danger-modal'"
        (click)="aceptar()">{{ r.options.aceptarTexto ?? 'Confirmar' }}</button>
    </div>
  </div>
</div>

<div class="boletas-container">
  <div class="page-title">
    <h2>LISTA DE EMPLEADOS</h2>
  </div>

  <div class="toolbar">
    <div class="filter-group">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" class="search-input" placeholder="Buscar por nombre, cargo o nivel..." [(ngModel)]="searchTerm">
    </div>

    <button class="btn-primary btn-nuevo" (click)="nuevoEmpleado()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Nuevo Empleado
    </button>
  </div>

  <div class="section-panel">
    <div class="panel-header-small">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Empleados Registrados</span>
    </div>

    <div class="table-responsive">
      <table class="data-table">
        <thead>
          <tr>
            <th class="col-id">#</th>
            <th>Nombres y Apellidos</th>
            <th>Cargo</th>
            <th>Área</th>
            <th>Teléfono</th>
            <th class="text-center">Estado</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="filteredEmpleados.length === 0">
            <td colspan="7" class="empty-state">No se encontraron empleados.</td>
          </tr>

          <tr *ngFor="let emp of filteredEmpleados; let i = index">
            <td class="col-id">{{ i + 1 }}</td>
            <td style="font-weight: 500;">{{ emp.nombre }} {{ emp.apellido }}</td>
            <td>{{ emp.cargo?.nombre || 'Sin Cargo' }}</td>
            <td>{{ emp.area?.nombre || 'Sin Área' }}</td>
            <td>{{ emp.telefono || '-' }}</td>

            <td class="text-center">
              <span class="badge-estado" [ngClass]="emp.estado === 'Activo' ? 'badge-active' : 'badge-vacaciones'">
                {{ emp.estado }}
              </span>
            </td>

            <td class="text-center">
              <div class="action-buttons">
                <!-- Ver Perfil -->
                <button class="btn-icon btn-icon-blue" (click)="verPerfil(emp)" title="Ver Perfil">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="acceso">
  <div class="acceso__ticket">

    <aside class="acceso__panel">
      <div class="sello">
        <img src="/logo-colegio.png" alt="Escudo del Colegio Adventista Túpac Amaru" />
      </div>
      <p class="acceso__institucion">Colegio Adventista</p>
      <p class="acceso__colegio">Túpac Amaru</p>
      <span class="acceso__filo" aria-hidden="true"></span>

      <!-- Esta pantalla es pública. No describe cómo se crean las cuentas,
           quién las crea ni con qué credenciales nacen: cualquiera de esos
           datos le ahorra trabajo a quien intente entrar sin permiso. -->
      <p class="acceso__motivo">Boletas de pago y documentos del personal</p>

      <!-- La costura entre el panel y el papel, picada como el talón de una
           boleta. El SVG ocupa el panel entero y se estira con él, así que
           su elipse —la misma que recorta el panel— cae siempre sobre el
           borde, esté la tarjeta de lado o apilada. -->
      <svg class="acceso__picado" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 0,-54 A 97.5,101.5 0 0 1 0,154" vector-effect="non-scaling-stroke" />
      </svg>
    </aside>

    <div class="acceso__hoja">
      <h1 class="acceso__titulo">Iniciar sesión</h1>
      <p class="acceso__intro">Sistema de uso exclusivo para el personal del colegio.</p>

      <!-- role="alert" para que el lector de pantalla lo anuncie solo: sin
           esto, quien no ve la pantalla escribe mal su clave y no se entera
           de que pasó nada. -->
      <div class="auth-alert auth-alert-error" *ngIf="errorMsg" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>
        </svg>
        {{ errorMsg }}
      </div>

      <form [formGroup]="form" (ngSubmit)="onLogin()">
        <div class="campo">
          <!-- Etiqueta a la vista y no solo para el lector: con el nombre del
               campo dentro del marcador, al escribir desaparece y ya nadie
               sabe cuál es cuál. -->
          <label class="campo__etiqueta" for="email">Correo electrónico</label>
          <div class="campo__control">
            <span class="campo__icono" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input
              type="email"
              id="email"
              formControlName="email"
              placeholder="nombre@colegio.edu.pe"
              [class.is-invalid]="emailInvalido"
              [attr.aria-invalid]="emailInvalido || null"
              [attr.aria-describedby]="emailInvalido ? 'error-email' : null"
              autocomplete="username"
            />
          </div>
          <small class="form-error" id="error-email" *ngIf="emailInvalido">
            Escribe un correo electrónico válido.
          </small>
        </div>

        <div class="campo campo--con-ojo">
          <label class="campo__etiqueta" for="password">Contraseña</label>
          <div class="campo__control">
            <span class="campo__icono" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              placeholder=""
              [class.is-invalid]="passwordInvalido"
              [attr.aria-invalid]="passwordInvalido || null"
              [attr.aria-describedby]="passwordInvalido ? 'error-password' : null"
              autocomplete="current-password"
              (keyup)="revisarMayusculas($event)"
              (blur)="mayusculasActivas = false"
            />
            <button type="button" class="campo__ojo" (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.1 12.3a1 1 0 0 1 0-.7 10.8 10.8 0 0 1 19.9 0 1 1 0 0 1 0 .7 10.8 10.8 0 0 1-19.9 0"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.7 5.1a10.7 10.7 0 0 1 11.2 6.5 1 1 0 0 1 0 .7 10.7 10.7 0 0 1-1.4 2.5"/><path d="M14.1 14.2a3 3 0 0 1-4.2-4.3"/><path d="M17.5 17.5A10.7 10.7 0 0 1 2.1 12.3a1 1 0 0 1 0-.7 10.7 10.7 0 0 1 4.4-5.1"/><path d="m2 2 20 20"/>
              </svg>
            </button>
          </div>
          <small class="form-error" id="error-password" *ngIf="passwordInvalido">Escribe tu contraseña.</small>
          <!-- El error de contraseña más común, y el que nadie ve venir. -->
          <small class="campo__aviso" *ngIf="mayusculasActivas && !passwordInvalido" role="status">
            Bloq Mayús está activado.
          </small>
        </div>

        <button type="submit" class="btn-primary acceso__enviar" [disabled]="isLoading">
          <span *ngIf="isLoading" class="spinner-small"></span>
          {{ isLoading ? 'Ingresando…' : 'Ingresar' }}
        </button>
      </form>

      <p class="acceso__pie">
        ¿Olvidaste tu contraseña?
        <a routerLink="/olvide-password">Recupérala por correo</a>
      </p>
    </div>

  </div>
</div>

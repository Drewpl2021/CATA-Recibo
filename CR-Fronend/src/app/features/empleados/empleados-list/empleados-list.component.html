<app-page-header
  icono="people"
  titulo="Empleados"
  subtitulo="Personal del colegio. Al dar de alta a uno se le crea su cuenta de acceso."
  [cifras]="cifras"
  [cargandoCifras]="cargando"
>
  <div headerActions style="display: flex; gap: 12px; flex-wrap: wrap;">
    <button class="btn-primary" (click)="nuevo()">
      <app-icon icono="plus" [tamano]="16"></app-icon>
      Nuevo Empleado
    </button>

    <button class="btn-warning" (click)="importar()">
      <app-icon icono="file_up" [tamano]="16"></app-icon>
      Importar empleados
    </button>

    <!-- La ficha completa de todo el personal, con lo que el buscador deje. -->
    <button class="btn-exportar" (click)="exportar()" [disabled]="exportando">
      <app-icon icono="excel" [tamano]="16"></app-icon>
      {{ exportando ? 'Generando…' : 'Descargar empleados' }}
    </button>
  </div>
</app-page-header>

<!-- Numerada y por fecha de registro: el 1 es siempre el último que se dio
     de alta, así que al volver de "Nuevo Empleado" se ve arriba del todo. -->
<!-- Lo que se hace con los marcados: activarlos o darlos de baja juntos. -->
<div class="form-nota form-nota--accion" *ngIf="marcados.length" role="status">
  <div>
    <strong>{{ marcados.length }} marcado(s).</strong>
    {{ resumenMarcados }}
  </div>
  <div style="display: flex; gap: 8px; flex-wrap: wrap;">
    <button type="button" class="btn-primary" (click)="cambiarEstadoMarcados('activo')" [disabled]="cambiandoEstado">
      <app-icon icono="user_check" [tamano]="16"></app-icon>
      Activar
    </button>
    <button type="button" class="btn-warning" (click)="cambiarEstadoMarcados('inactivo')" [disabled]="cambiandoEstado">
      <app-icon icono="user_off" [tamano]="16"></app-icon>
      Dar de baja
    </button>
    <button type="button" class="btn-secondary" (click)="soltarMarcados()" [disabled]="cambiandoEstado">
      Quitar selección
    </button>
  </div>
</div>

<app-data-table
  #tablaEmpleados
  [busquedaInicial]="busqueda"
  [seleccionable]="true"
  (cambioSeleccion)="marcados = $event"
  entidad="este empleado"
  [columnas]="columnas"
  [datos]="empleados"
  [cargando]="cargando"
  [paginacionServidor]="true"
  [totalElementos]="total"
  [pagina]="pagina"
  [filasPorPagina]="TAMANO_PAGINA"
  [numerarFilas]="true"
  (cambioPagina)="irAPagina($event)"
  (cambioBusqueda)="buscar($event)"
  [camposBusqueda]="['dni', 'nombre', 'apellido', 'cargo.nombre', 'area.nombre', 'usuario.email']"
  [acciones]="['editar']"
  [accionesPersonalizadas]="accionesExtra"
  mensajeVacio="Todavía no hay empleados registrados."
  (editarFila)="editar($event)"
  (accionPersonalizada)="alAccionar($event)"
>
  <!-- El embudo va junto al buscador: el texto encuentra a una persona, los
       filtros contestan "quiénes de Jerusalén con plazo fijo". -->
  <app-filtros tableActions [campos]="camposFiltro" [(valores)]="filtros"
    (cambio)="alFiltrar()" (primeraApertura)="cargarCatalogos()"></app-filtros>
</app-data-table>

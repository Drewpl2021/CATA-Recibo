<app-page-header icono="people" [titulo]="titulo" [subtitulo]="subtitulo">
  <button headerActions class="btn-secondary" type="button" (click)="volver()">
    <app-icon icono="arrow_left" [tamano]="16"></app-icon>
    Volver a la lista
  </button>
</app-page-header>

<div class="section-panel section-panel--formulario">
  <p *ngIf="cargando" class="data-table-empty">Cargando…</p>

  <ng-container *ngIf="!cargando">
    <!-- A quién se está mirando, con la foto que él mismo subió a su cuenta.
         En un alta no va: todavía no hay trabajador ni cuenta de donde
         traerla. Acá solo se ve: la foto la cambia él desde Mi Perfil. -->
    <div class="ficha-persona" *ngIf="!esNuevo">
      <span class="avatar ficha-persona__foto">
        <img *ngIf="fotoUrl" class="avatar__foto" [src]="fotoUrl"
          [alt]="'Foto de ' + nombreCompleto" />
        <ng-container *ngIf="!fotoUrl">{{ iniciales }}</ng-container>
      </span>

      <div class="ficha-persona__datos">
        <strong class="ficha-persona__nombre">{{ nombreCompleto }}</strong>
        <span class="ficha-persona__resumen" *ngIf="resumenPersona">{{ resumenPersona }}</span>
        <small class="ficha-persona__nota" *ngIf="!fotoUrl">
          {{ usuarioVinculado
              ? 'Todavía no sube su foto desde Mi Perfil.'
              : 'Todavía no tiene cuenta de acceso.' }}
        </small>
      </div>
    </div>

    <app-wizard [pasos]="pasos" [(actual)]="paso" [form]="form" #wizard></app-wizard>

    <form [formGroup]="form" (ngSubmit)="guardar()">
      <app-seccion-personales *ngIf="pasoActual === 'personales'"
        [form]="form" [soloLectura]="soloLectura" [esNuevo]="esNuevo"></app-seccion-personales>

      <app-seccion-laborales *ngIf="pasoActual === 'laborales'"
        [form]="form" [soloLectura]="soloLectura" [esNuevo]="esNuevo"
        [areas]="areas" [cargos]="cargos" [sedes]="sedes"
        [contratos]="contratos" [cargandoContratos]="cargandoContratos"></app-seccion-laborales>

      <app-seccion-planilla *ngIf="pasoActual === 'planilla'"
        [form]="form" [soloLectura]="soloLectura" [esNuevo]="esNuevo"></app-seccion-planilla>

      <app-seccion-complementarios *ngIf="pasoActual === 'complementarios'"
        [form]="form" [soloLectura]="soloLectura" [esNuevo]="esNuevo"
        [hojaDeVida]="hojaDeVida"
        (cvElegido)="cvArchivo = $event"
        (descargarCv)="descargarHojaDeVida()"></app-seccion-complementarios>

      <app-seccion-acceso *ngIf="pasoActual === 'acceso'"
        [form]="form" [soloLectura]="soloLectura"
        [roles]="roles" [esNuevo]="esNuevo"></app-seccion-acceso>

      <div class="form-pie">
        <button type="button" class="btn-secondary" *ngIf="!wizard.esPrimero"
          (click)="wizard.anterior()">
          Anterior
        </button>

        <div class="form-pie__derecha">
          <button type="button" class="btn-secondary" (click)="volver()">
            {{ soloLectura ? 'Cerrar' : 'Cancelar' }}
          </button>

          <button type="button" class="btn-primary" *ngIf="!wizard.esUltimo"
            (click)="wizard.siguiente()">
            Siguiente
          </button>

          <button type="submit" class="btn-primary" *ngIf="wizard.esUltimo && !soloLectura"
            [disabled]="guardando">
            {{ guardando ? 'Guardando…' : (esNuevo ? 'Registrar empleado' : 'Guardar cambios') }}
          </button>
        </div>
      </div>
    </form>
  </ng-container>
</div>

<app-page-header
  icono="receipt_long"
  titulo="Historial de Boletas"
  subtitulo="Todas las boletas emitidas a un trabajador, para consultarlas o volver a descargarlas."
></app-page-header>

<section class="panel-filtros">
  <div class="panel-filtros__campos">
    <div class="campo-filtro">
      <label for="filtroEmpleado">Trabajador</label>
      <select id="filtroEmpleado" class="form-control" [(ngModel)]="empleadoId"
        (ngModelChange)="alCambiarEmpleado()">
        <option value="" disabled>Elige un trabajador...</option>
        <option *ngFor="let emp of empleados" [value]="emp.id">
          {{ emp.nombre }} {{ emp.apellido }} — DNI {{ emp.dni }}
        </option>
      </select>
    </div>
  </div>
</section>

<app-data-table
  entidad="esta boleta"
  [columnas]="columnas"
  [datos]="documentos"
  [cargando]="cargando"
  [paginacionServidor]="true"
  [totalElementos]="total"
  [pagina]="pagina"
  [filasPorPagina]="TAMANO_PAGINA"
  (cambioPagina)="irAPagina($event)"
  (cambioBusqueda)="buscar($event)"
  [camposBusqueda]="['tipo']"
  [acciones]="[]"
  [accionesPersonalizadas]="acciones"
  (accionPersonalizada)="alAccionar($event)"
  [mensajeVacio]="empleadoId ? 'Este trabajador todavía no tiene boletas emitidas.' : 'Elige un trabajador para ver sus boletas.'"
></app-data-table>

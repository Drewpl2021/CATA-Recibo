<app-page-header
  icono="folder_shared"
  titulo="Mis Documentos"
  subtitulo="Tus boletas y documentos laborales. Acá los revisas y los firmas."
  [cifras]="cifras"
  [cargandoCifras]="cargando"
></app-page-header>

<app-data-table
  entidad="este documento"
  [columnas]="columnas"
  [datos]="documentos"
  [cargando]="cargando"
  [paginacionServidor]="true"
  [totalElementos]="total"
  [pagina]="pagina"
  [filasPorPagina]="TAMANO_PAGINA"
  (cambioPagina)="irAPagina($event)"
  (cambioBusqueda)="buscar($event)"
  [camposBusqueda]="['tipo']"
  [acciones]="[]"
  [accionesPersonalizadas]="acciones"
  (accionPersonalizada)="alAccionar($event)"
  mensajeVacio="Todavía no tienes documentos emitidos."
></app-data-table>

<!-- Modal: firmar el documento con la contraseña de la cuenta -->
<div class="modal-overlay" *ngIf="mostrarModalFirmar" (click)="cerrarModalFirmar()">
  <div class="modal-card" style="text-align:left;" (click)="$event.stopPropagation()">
    <h3 style="margin-bottom:8px; color:var(--heading);">Firmar documento</h3>
    <p style="margin-bottom:20px; color:var(--text-muted); font-size:0.9em;">
      Ingresa tu contraseña para confirmar la firma del documento de
      <strong>{{ periodo(docAFirmar) }}</strong>.
    </p>
    <div class="form-group" style="margin-bottom:24px;">
      <label style="font-weight:500; display:block; margin-bottom:6px;">
        Contraseña <span style="color:var(--danger-text)">*</span>
      </label>
      <input type="password" class="form-control" placeholder="Tu contraseña..."
        [(ngModel)]="passwordFirma" (keyup.enter)="confirmarFirma()">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary-modal" (click)="cerrarModalFirmar()" [disabled]="firmando">Cancelar</button>
      <button class="btn-warning" (click)="confirmarFirma()" [disabled]="firmando">
        {{ firmando ? 'Firmando...' : 'Confirmar firma' }}
      </button>
    </div>
  </div>
</div>

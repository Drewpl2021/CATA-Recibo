<app-page-header
  icono="money"
  titulo="Descuentos y Bonificaciones"
  subtitulo="Ajustes puntuales de este trabajador para el mes que se está emitiendo."
>
  <button headerActions class="btn-secondary" (click)="volver()">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
    </svg>
    Volver
  </button>
</app-page-header>

<div class="boletas-container">

  <div class="section-panel" style="max-width: 800px;">
    <div class="panel-header-small">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Empleado Seleccionado: <strong style="color: var(--text);">{{ nombreEmpleado }}</strong></span>
    </div>

    <div class="form-content" style="padding: 24px;">
      
      <!-- Sección Descuentos -->
      <h3 style="font-size: 1.1rem; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 16px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--danger); vertical-align: text-bottom; margin-right: 6px;" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" >
          <path d="M16 17h6v-6"/><path d="m22 17-8.5-8.5-5 5L2 7"/>
        </svg>
        Descuentos Aplicables
      </h3>
      
      <div class="checkbox-group" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px;">
        <label class="checkbox-container">
          <input type="checkbox" [(ngModel)]="descPredeterminado">
          <span class="checkmark"></span>
          Descuento Predeterminado (10%)
        </label>
        
        <label class="checkbox-container">
          <input type="checkbox" [(ngModel)]="descAfp">
          <span class="checkmark"></span>
          Descuento por AFP
        </label>
        
        <label class="checkbox-container">
          <input type="checkbox" [(ngModel)]="descSeguro">
          <span class="checkmark"></span>
          Descuento por Seguro
        </label>
      </div>

      <!-- Sección Bonificaciones -->
      <h3 style="font-size: 1.1rem; color: var(--text); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 16px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--success); vertical-align: text-bottom; margin-right: 6px;" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" >
          <path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/>
        </svg>
        Bonificaciones Adicionales
      </h3>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px;">
        <div class="form-group">
          <label style="display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.9rem;">Monto de Bonificación (S/)</label>
          <input type="number" class="form-control" placeholder="Ej. 150.00" [(ngModel)]="montoBonificacion">
        </div>
        
        <div class="form-group">
          <label style="display: block; margin-bottom: 6px; font-weight: 500; font-size: 0.9rem;">Concepto de Bonificación</label>
          <input type="text" class="form-control" placeholder="Ej. Bono de puntualidad" [(ngModel)]="conceptoBonificacion">
        </div>
      </div>

      <!-- Botones de Acción -->
      <div style="display: flex; justify-content: flex-end; gap: 16px; margin-top: 20px;">
        <button class="btn-secondary" (click)="volver()" style="padding: 10px 20px; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 6px; cursor: pointer;">
          Cancelar
        </button>
        <button class="btn-primary" (click)="guardar()" style="padding: 10px 24px; font-size: 1rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
            <path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/>
          </svg>
          Guardar y Asignar
        </button>
      </div>

    </div>
  </div>
</div>

<app-page-header
  icono="location_on"
  titulo="Sedes"
  subtitulo="Locales del colegio donde puede estar asignado un empleado."
  [cifras]="cifras"
  [cargandoCifras]="cargando"
>
  <button headerActions class="btn-primary" (click)="nueva()">
    <app-icon icono="plus" [tamano]="16"></app-icon>
    Nueva Sede
  </button>
</app-page-header>

<app-data-table
  entidad="la sede"
  [columnas]="columnas"
  [datos]="sedes"
  [cargando]="cargando"
  [paginacionServidor]="true"
  [totalElementos]="total"
  [pagina]="pagina"
  (cambioPagina)="irAPagina($event)"
  (cambioBusqueda)="buscar($event)"
  [camposBusqueda]="['nombre', 'direccion']"
  [acciones]="['editar', 'eliminar']"
  mensajeVacio="Todavía no hay sedes registradas."
  (editarFila)="editar($event)"
  (eliminarFila)="eliminar($event)"
></app-data-table>

<app-form-modal
  [(visible)]="modalVisible"
  [titulo]="sedeEditando ? 'Editar Sede' : 'Nueva Sede'"
  [guardando]="guardando"
  (guardar)="guardar()"
  (cancelar)="cerrarModal()"
>
  <form [formGroup]="form" class="form-fields">
    <div class="form-group">
      <label for="nombre">Nombre *</label>
      <input type="text" id="nombre" class="form-control" formControlName="nombre" placeholder="Ej. CATA"
        [class.is-invalid]="invalido('nombre')" />
      <small class="form-error" *ngIf="invalido('nombre')">
        El nombre es obligatorio (máximo 100 caracteres).
      </small>
    </div>

    <div class="form-group">
      <label for="direccion">Dirección</label>
      <input type="text" id="direccion" class="form-control" formControlName="direccion"
        placeholder="Ej. Jr. Moquegua N° 852" [class.is-invalid]="invalido('direccion')" />
      <small class="form-error" *ngIf="invalido('direccion')">Máximo 255 caracteres.</small>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" class="form-control" formControlName="telefono"
          placeholder="Ej. 951234567" [class.is-invalid]="invalido('telefono')" />
        <small class="form-error" *ngIf="invalido('telefono')">Máximo 15 caracteres.</small>
      </div>

      <div class="form-group">
        <label for="estado">Estado</label>
        <select id="estado" class="form-control" formControlName="estado">
          <option *ngFor="let op of estadoOpciones" [value]="op.value">{{ op.label }}</option>
        </select>
      </div>
    </div>
  </form>
</app-form-modal>

<app-page-header
  icono="receipt_long"
  titulo="Mis Boletas"
  [subtitulo]="'Hola ' + userName + '. Acá están tus boletas de pago: revísalas y fírmalas.'"
  [cifras]="cifras"
  [cargandoCifras]="cargando"
></app-page-header>

<section class="panel-filtros">
  <div class="panel-filtros__campos">
    <div class="campo-filtro campo-filtro--corto">
      <label for="anioBoletas">Año</label>
      <select id="anioBoletas" class="form-control" [(ngModel)]="anioElegido"
        (ngModelChange)="alCambiarAnio()">
        <option *ngFor="let a of anios" [ngValue]="a">{{ a }}</option>
      </select>
    </div>
  </div>
</section>

<div class="alert-error" *ngIf="errorMsg">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2">
    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
  </svg>
  {{ errorMsg }}
</div>

<app-data-table
  entidad="esta boleta"
  [columnas]="columnas"
  [datos]="boletas"
  [cargando]="cargando"
  [paginacionServidor]="true"
  [totalElementos]="total"
  [pagina]="pagina"
  [filasPorPagina]="TAMANO_PAGINA"
  (cambioPagina)="irAPagina($event)"
  [mostrarBuscador]="false"
  [acciones]="[]"
  [accionesPersonalizadas]="acciones"
  (accionPersonalizada)="alAccionar($event)"
  [mensajeVacio]="'Todavía no tienes boletas emitidas del ' + anioElegido + '.'"
></app-data-table>

<!-- Visor de la boleta en PDF -->
<div class="pdf-modal-overlay" *ngIf="showPdfModal" (click)="closePdfModal()">
  <div class="pdf-modal-container" (click)="$event.stopPropagation()">
    <div class="pdf-modal-header">
      <h3>{{ pdfBoletaName }}</h3>
      <div style="display: flex; gap: 12px; align-items: center;">
        <button class="btn-primary" (click)="descargarPdfDirecto()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Descargar
        </button>
        <button class="btn-close" (click)="closePdfModal()" aria-label="Cerrar">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="pdf-modal-body">
      <!-- El visor (pdf.js, medio mega) se descarga en el momento en que se
           abre este modal, no al entrar a la pantalla. Quien solo mire la
           lista o descargue el archivo no lo trae nunca. -->
      @defer (when showPdfModal) {
        <app-visor-pdf [src]="pdfUrl"></app-visor-pdf>
      } @placeholder {
        <div class="cargando-caja">
          <span class="cargador"></span>
          <span>Abriendo la boleta…</span>
        </div>
      }
    </div>
  </div>
</div>

<!-- Firmar la boleta con la contraseña de la cuenta -->
<div class="pdf-modal-overlay" *ngIf="showSignModal" (click)="closeSignModal()">
  <div class="sign-modal-container" (click)="$event.stopPropagation()">
    <div class="pdf-modal-header">
      <h3>Firmar boleta</h3>
      <button class="btn-close" (click)="closeSignModal()" aria-label="Cerrar">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="pdf-modal-body" style="padding: 24px;">
      <p style="margin-bottom: 20px; color: var(--text-muted); font-size: 14px;">
        Para firmar tu boleta de <strong>{{ boletaAFirmar?.mes }} {{ boletaAFirmar?.anio }}</strong>,
        ingresa la contraseña con la que entras al sistema.
      </p>

      <div class="form-group">
        <label for="passwordFirma">Contraseña</label>
        <input id="passwordFirma" type="password" class="form-control" [(ngModel)]="signPassword"
          placeholder="Tu contraseña" (keyup.enter)="confirmarFirma()">
      </div>

      <small class="form-error" *ngIf="signErrorMsg">{{ signErrorMsg }}</small>

      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
        <button class="btn-secondary" (click)="closeSignModal()" [disabled]="isSigning">Cancelar</button>
        <button class="btn-primary" (click)="confirmarFirma()" [disabled]="isSigning">
          {{ isSigning ? 'Firmando...' : 'Firmar boleta' }}
        </button>
      </div>
    </div>
  </div>
</div>

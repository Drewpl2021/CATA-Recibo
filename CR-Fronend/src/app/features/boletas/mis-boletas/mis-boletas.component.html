<app-page-header
  icono="receipt_long"
  titulo="Mis Boletas"
  [subtitulo]="'Hola ' + userName + '. Acá están tus boletas de pago: revísalas y fírmalas.'"
  [cifras]="cifras"
  [cargandoCifras]="cargando"
></app-page-header>

<!-- Qué le falta para tener su cuenta lista. Se va solo cuando no falta
     nada, y se puede ocultar. -->
<app-primeros-pasos></app-primeros-pasos>

<section class="panel-filtros">
  <div class="panel-filtros__campos panel-filtros__campos--compacto">
    <div class="campo-filtro campo-filtro--corto">
      <label for="anioBoletas">Año</label>
      <select id="anioBoletas" class="form-control" [(ngModel)]="anioElegido"
        (ngModelChange)="alCambiarAnio()">
        <option *ngFor="let a of anios" [ngValue]="a">{{ a }}</option>
      </select>
    </div>
  </div>
</section>

<div class="alert-error" *ngIf="errorMsg">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>
  </svg>
  {{ errorMsg }}
</div>

<app-data-table
  entidad="esta boleta"
  [columnas]="columnas"
  [datos]="boletas"
  [cargando]="cargando"
  [numerarFilas]="true"
  [paginacionServidor]="true"
  [totalElementos]="total"
  [pagina]="pagina"
  [filasPorPagina]="TAMANO_PAGINA"
  (cambioPagina)="irAPagina($event)"
  [mostrarBuscador]="false"
  [acciones]="[]"
  [accionesPersonalizadas]="acciones"
  (accionPersonalizada)="alAccionar($event)"
  [mensajeVacio]="'Todavía no tienes boletas emitidas del ' + anioElegido + '.'"
></app-data-table>

<!-- Visor de la boleta en PDF -->
<div class="pdf-modal-overlay" *ngIf="showPdfModal" (click)="closePdfModal()">
  <div class="pdf-modal-container" (click)="$event.stopPropagation()">
    <div class="pdf-modal-header">
      <h3>{{ pdfBoletaName }}</h3>
      <div style="display: flex; gap: 12px; align-items: center;">
        <span class="form-ayuda" *ngIf="!boletaAbierta?.firmado">Fírmala y podrás descargarla.</span>
        <button class="btn-primary" *ngIf="boletaAbierta?.firmado" (click)="descargarPdfDirecto()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 15V3"/><path d="m7 10 5 5 5-5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          </svg>
          Descargar
        </button>
        <button class="btn-close" (click)="closePdfModal()" aria-label="Cerrar">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="pdf-modal-body">
      <!-- El visor (pdf.js, medio mega) se descarga en el momento en que se
           abre este modal, no al entrar a la pantalla. Quien solo mire la
           lista o descargue el archivo no lo trae nunca. -->
      @defer (when showPdfModal) {
        <app-visor-pdf [src]="pdfUrl"></app-visor-pdf>
      } @placeholder {
        <div class="cargando-caja">
          <span class="cargador"></span>
          <span>Abriendo la boleta…</span>
        </div>
      }
    </div>
  </div>
</div>

<!-- Firmar la boleta con la contraseña de la cuenta -->
<app-form-modal
  [visible]="showSignModal"
  titulo="Firmar boleta"
  textoGuardar="Firmar boleta"
  [guardando]="isSigning"
  (guardar)="confirmarFirma()"
  (cancelar)="closeSignModal()"
>
  <div class="form-fields">
    <p class="form-nota">
      Para firmar tu boleta de <strong>{{ boletaAFirmar?.mes }} {{ boletaAFirmar?.anio }}</strong>,
      escribe la contraseña con la que entras al sistema.
    </p>
    <div class="form-group">
      <label for="passwordFirma">Contraseña</label>
      <input id="passwordFirma" type="password" class="form-control" [(ngModel)]="signPassword"
        placeholder="Tu contraseña" autocomplete="current-password" (keyup.enter)="confirmarFirma()" />
      <small class="form-error" *ngIf="signErrorMsg">{{ signErrorMsg }}</small>
    </div>
  </div>
</app-form-modal>

<!doctype html>
<!-- es-PE y no "en": los campos de fecha nativos de algunos navegadores
     (Firefox, Safari) se dibujan según el idioma de la página, y con "en"
     mostraban mm/dd/aaaa — el 01/12 se leía como 12 de enero. -->
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <title>CATA Recibo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sistema de gestión de recursos humanos y boletas del Colegio Adventista Túpac Amaru.">
  <!-- El logo del colegio, no el rombo de Angular que trae la plantilla por
       defecto: el ícono de la pestaña es lo primero que se ve, antes de que
       la página siquiera cargue. -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="225x225" href="logo-colegio.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Sin la fuente "Material Icons": ninguna pantalla la usa (los íconos
       salen del catálogo, shared/icons/icon-map.ts) y se descargaba igual en
       cada carga de página. -->
</head>
<body>
  <app-root></app-root>
</body>
</html>

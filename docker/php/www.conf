; ─────────────────────────────────────────────────────────────
;  El pool de PHP-FPM: cuántas peticiones atiende el servidor
;  AL MISMO TIEMPO.
; ─────────────────────────────────────────────────────────────
;  Antes esto no existía: el contenedor corría con el pool de
;  fábrica de la imagen (pm.max_children = 5), pensado para
;  probar en una laptop, no para un colegio entero firmando
;  boletas el mismo día. Con 5, doscientos docentes entrando a
;  la vez no fallaban, pero hacían fila detrás de cinco cupos —
;  la pantalla se sentía trabada, y si una petición se colgaba
;  (hasta max_execution_time = 120s, ver cata.ini), arrastraba a
;  los de atrás en la cola.
;
;  Los números de abajo son un punto de partida razonable para un
;  VPS chico/mediano (2-4 GB de RAM), no una medición del
;  servidor de verdad: nadie en este proyecto sabía cuánta RAM
;  tiene el VPS de producción al escribir esto. La cuenta para
;  recalcularlos cuando sí se sepa:
;
;      pm.max_children = (RAM que le toca a PHP) / (RAM por proceso)
;
;  "RAM que le toca a PHP" es lo que sobra después de MySQL,
;  nginx y el sistema operativo — en un VPS de 4 GB, calcula que
;  PHP se queda con 1.5-2 GB. "RAM por proceso" en este sistema
;  anda entre 40 y 100 MB en uso normal (memory_limit = 512M en
;  cata.ini es el TECHO de emergencia, no lo que gasta cada
;  petición). Con esa cuenta, un VPS de 4 GB aguanta unos 20-25;
;  uno de 8 GB, 30-40 sin apuro.
; ─────────────────────────────────────────────────────────────
[www]
user = www-data
group = www-data

listen = 9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Cada proceso se reinicia solo a los 500 pedidos: una fuga de
; memoria chica, repetida miles de veces en un día de firmas, es
; lo que termina tumbando un worker. Reiniciarlo de cuando en
; cuando es más barato que perseguir la fuga.
pm.max_requests = 500

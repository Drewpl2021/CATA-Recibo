; ─────────────────────────────────────────────────────────────
;  Ajustes de PHP para el servidor
; ─────────────────────────────────────────────────────────────
;  Los que trae la imagen por defecto están pensados para
;  desarrollo. Estos son los que cambian algo de verdad para
;  este sistema.
; ─────────────────────────────────────────────────────────────

; No anunciar la versión de PHP en cada respuesta. Un "X-Powered-By:
; PHP/8.3.30" le dice a cualquiera qué buscar cuando salga un fallo conocido
; de esa versión exacta.
expose_php = Off

; Nunca mostrar errores en pantalla: en un sistema de planillas
; una traza de PHP en la respuesta enseña rutas y credenciales.
; Los errores van al log, que en Docker es la salida estándar.
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Las firmas y huellas se suben como imágenes desde el móvil, que
; pueden pasar tranquilamente de 2 MB.
upload_max_filesize = 12M
post_max_size = 14M

; Armar el PDF de la boleta de todo el personal en una sola
; llamada (generar-masivo) lleva su rato: con 30s se cortaba a
; mitad y dejaba boletas sin archivo.
max_execution_time = 120
memory_limit = 512M

; ── Opcache ──────────────────────────────────────────────────
; Sin esto PHP vuelve a compilar cada archivo en cada petición.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; El código dentro de la imagen no cambia nunca: no hace falta
; que PHP ande mirando si los archivos se tocaron. Para actualizar
; se construye una imagen nueva.
opcache.validate_timestamps = 0

; La hora del colegio, para que coincida con la de Laravel.
date.timezone = America/Lima

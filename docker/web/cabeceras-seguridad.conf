# Cabeceras de seguridad, en su propio archivo para poder repetirlas.
#
# No es por gusto: en nginx los `add_header` NO se heredan. Un `location` que
# declara aunque sea uno propio DESCARTA todos los del nivel de arriba. Con
# ellas solo en el server, la página principal salía sin ninguna porque su
# location añade su Cache-Control. Se comprobó con curl -I.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# El sistema no usa cámara, micrófono ni ubicación: así tampoco los puede
# pedir nada que se cuele en la página.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# De dónde puede cargar cosas la página. Es la red de seguridad contra XSS:
# aunque alguien lograra inyectar un <script src="otro-sitio">, el navegador
# se niega a traerlo.
#
# 'unsafe-inline' va en los estilos porque Angular y los gráficos del Panel
# de Control escriben estilos en línea; en los SCRIPTS no está, que es donde
# de verdad importa. blob: en img-src y worker-src los necesita el visor de
# boletas (pdf.js).
# Los dos permisos para fonts.googleapis.com / fonts.gstatic.com son porque
# index.html carga la tipografía Inter y los iconos de Material desde ahí. Con
# el CSP cerrado, la consola del navegador llenaba de bloqueos y la aplicación
# caía a la tipografía del sistema — se vio al probarlo.
#
# Lo mejor sería servir la tipografía desde el propio servidor: una petición
# externa menos, funciona sin internet (en la red del colegio importa) y no se
# le cuenta a Google quién entra al sistema. Queda pendiente.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

# ─────────────────────────────────────────────────────────────
#  El portero: una sola puerta para todo
# ─────────────────────────────────────────────────────────────
#  Esta es la pieza que hace que las peticiones funcionen sin
#  configurar nada por IP ni por dominio:
#
#      /        →  la aplicación de Angular (archivos estáticos)
#      /api/…   →  Laravel (php-fpm, en el contenedor "app")
#
#  Al salir las dos por el mismo sitio, el navegador ve una sola
#  dirección: el frontend pide "/api/login" sin saber en qué
#  servidor está. Por eso funciona igual entrando por la IP hoy
#  y por el dominio mañana, SIN volver a compilar nada — y por
#  eso tampoco hay CORS que pelear: no hay dos orígenes.
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # Las imágenes de firma y huella llegan desde el móvil.
    # Tiene que ir a juego con upload_max_filesize del php.ini.
    client_max_body_size 14M;

    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la versión de nginx.
    server_tokens off;

    # ── Cabeceras de seguridad ───────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── El API ───────────────────────────────────────────────
    # ^~ para que ninguna regla por expresión regular se lo quite.
    location ^~ /api {
        root /var/www/html/public;
        try_files $uri @laravel;
    }

    location @laravel {
        root /var/www/html/public;

        include fastcgi_params;
        fastcgi_pass app:9000;

        # index.php atiende TODAS las rutas: Laravel decide por
        # REQUEST_URI, que llega intacto ("/api/login").
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $uri;

        # Emitir las boletas de todo el personal en una sola
        # llamada tarda: con los 60s de fábrica se cortaba.
        fastcgi_read_timeout 180;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # ── La aplicación de Angular ─────────────────────────────
    # Los archivos con hash en el nombre no cambian nunca: se
    # pueden guardar en el navegador todo un año.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El index NO se cachea: es el que trae los nombres de los
    # archivos nuevos después de cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Angular resuelve sus rutas por dentro: cualquier dirección
    # que no sea un archivo real devuelve el index y el navegador
    # decide qué pantalla toca. Sin esto, recargar en
    # /inicio/empleados daba 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
